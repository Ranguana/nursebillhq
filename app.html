<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://accounts.google.com; connect-src 'self' https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com;">
  <title>NurseBill</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <style>
    .titlebar-drag {
      position: fixed; top: 0; left: 0; right: 0; height: 38px;
      -webkit-app-region: drag; z-index: 9999; pointer-events: none;
    }
    .sidebar { -webkit-app-region: no-drag; }
    .sidebar-brand { padding-top: 42px !important; }
  </style>
</head>
<body>
  <div class="titlebar-drag"></div>
  <div id="root"></div>

  <script>
    if (!window.electronAPI) {
      console.log('Running in browser mode — file operations simulated.');
      window.electronAPI = {
        readFolderTree: async () => ({
          rootPath: '~/Desktop/NurseBill Cases',
          lawyers: [
            { name: 'Anderson, Karen', path: '~/Desktop/NurseBill Cases/Anderson, Karen', files: [],
              clients: [
                { name: 'Thompson, David', path: '~/Desktop/NurseBill Cases/Anderson, Karen/Thompson, David', files: [
                  { name: 'Toxicology_Report_2026.pdf', path: '~/...pdf', size: 2516582, modified: '2026-02-15T10:00:00Z', created: '2026-02-15T10:00:00Z', extension: 'pdf' },
                ]},
              ]
            },
          ],
        }),
        createLawyerFolder: async (name) => `~/Desktop/NurseBill Cases/${name}`,
        createClientFolder: async (lawyer, client) => `~/Desktop/NurseBill Cases/${lawyer}/${client}`,
        getRootPath: async () => '~/Desktop/NurseBill Cases',
        getFiles: async () => [],
        copyToCase: async (src, lawyer, client) => src,
        moveToCase: async (src, lawyer, client) => src,
        trashFile: async (path) => true,
        renameFile: async (old, name) => old,
        openFile: async (path) => {},
        openInFinder: async (path) => {},
        pickFiles: async () => [],
        pickFolder: async () => null,
        setRootPath: async (p) => p,
        readFile: async (filePath) => null,
        saveFile: async () => null,
        isElectron: async () => false,
        getVersion: async () => '1.0.0 (browser)',
        onFolderChange: () => {},
        onRefreshHint: () => {},
        removeAllListeners: () => {},
      };
    }
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
