<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://accounts.google.com; connect-src 'self' https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com;">
  <title>NurseBill</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <style>
    /* Mac-native feel: draggable title bar area */
    .titlebar-drag {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 38px;
      -webkit-app-region: drag;
      z-index: 9999;
      pointer-events: none;
    }
    /* Make sidebar buttons clickable through the drag region */
    .sidebar { -webkit-app-region: no-drag; }
    .sidebar-brand { padding-top: 42px !important; } /* Space for traffic lights */
  </style>
</head>
<body>
  <!-- Invisible drag area for native Mac window dragging -->
  <div class="titlebar-drag"></div>
  
  <!-- App root — the React dashboard renders here -->
  <div id="root"></div>

  <script>

     * ELECTRON API BRIDGE
     * 
     * This script checks if we're running in Electron or a regular browser.
     * If Electron: window.electronAPI is available (from preload.js)
     * If browser: we create a mock version so the dashboard still works
     * 
     * This means you can develop in a browser and it still works!
     */
    if (!window.electronAPI) {
      console.log('Running in browser mode (no Electron). File operations will be simulated.');
      
      // Mock file system for browser development
      window.electronAPI = {
        readFolderTree: async () => ({

        moveToCase: async (src, lawyer, client) => { console.log('Would move:', src, '→', lawyer, client); return src; },
        trashFile: async (path) => { console.log('Would trash:', path); return true; },

</html>
